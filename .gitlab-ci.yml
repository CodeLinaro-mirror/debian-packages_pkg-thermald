default:
  tags:
    - arm64-runner

variables:
  RECIPE_REPO_URL: "https://github.com/qualcomm-linux/pkg-thermald"
  RECIPE_REPO_BRANCH: "qli-staging/debian/latest"
  ARTIFACTORY_BASE_URL: "https://artifacts.codelinaro.org"
  ARTIFACTORY_TARGET: "pkg-thermald"
  # Kubernetes resources
  KUBERNETES_CPU_REQUEST: "4"
  KUBERNETES_MEMORY_REQUEST: "16G"
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "40G"

stages:
  - build
  - upload

build:deb:
  stage: build
  when: manual
  image: debian:trixie
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends devscripts equivs build-essential git
    - git clone --branch "${RECIPE_REPO_BRANCH}" --depth 1 "${RECIPE_REPO_URL}" recipe
    - mk-build-deps -ir -t "apt-get -y --no-install-recommends" recipe/debian/control
  script:
    - cd recipe && dpkg-buildpackage -us -uc -b
  after_script:
    - mkdir -p dist
    - mv *.deb *.changes *.buildinfo dist/ 2>/dev/null || true
  artifacts:
    paths:
      - dist/*.deb
      - dist/*.changes
      - dist/*.buildinfo
    expire_in: 1 week

upload:
  stage: upload
  needs: ["build:deb"]
  image: debian:trixie
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates
    - curl -fL https://install-cli.jfrog.io | sh
  script:
    - jf c add clo-artifactory --url="${ARTIFACTORY_BASE_URL}" --user="${JFROG_USERNAME}" --password="${JFROG_PASSWORD}" --enc-password=false --interactive=false --basic-auth-only
    - jf rt upload "dist/*" "${ARTIFACTORY_TARGET}/"
